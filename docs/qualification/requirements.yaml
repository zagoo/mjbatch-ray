# RaySimBatch requirement matrix. Source of truth for docs/qualification/requirements.md
# (tools/render_requirements.py) and checked by tests/tooling/test_requirements.py: every
# implementation, test and evidence path must exist.
#
# Status: VERIFIED     implemented and verified here with real components (evidence given)
#         IMPLEMENTED  implemented; verification incomplete (reason in notes)
#         BLOCKED      cannot be verified in this environment (procedure in notes)
#         NOT_STARTED  not implemented
# Test commands assume `source tools/env.sh && eval "$(tools/local_services.sh env)"`.

requirements:
  # ------------------------------------------------------------------ assignment-level
  - id: R-NI-1
    section: "Assignment §4; design §1 (AM-0)"
    requirement: RaySimBatch integrates MJBatch without modifying, patching, vendoring, monkey-patching or private-layout access; one import boundary; builds outside the checkout.
    implementation: [src/raysimbatch/compat/mjbatch_adapter.py, tools/check_mjbatch_clean.py, pyproject.toml]
    config: []
    tests: [tests/tooling/test_noninvasive.py, tests/upstream/test_mjbatch_contract.py]
    evidence: [docs/mjbatch-integration.md, docs/qualification/report.md]
    status: VERIFIED
  - id: R-NI-2
    section: "Assignment §4 (upgrade workflow)"
    requirement: MJBatch upgrades run as an isolated candidate (worktree + venv), pass gates (probes, contract, parity, performance, pristine tree), then promote the pin; rollback restores the committed pin.
    implementation: [tools/mjbatch_upgrade.py, src/raysimbatch/compat/mjbatch_adapter.py]
    config: []
    tests: [tests/tooling/test_noninvasive.py]
    evidence: [evidence/mjbatch-upgrade, docs/operations/mjbatch-upgrade.md]
    status: VERIFIED
    notes: "Candidate 121e033 (origin/mujoco-versions) passed all four gates (A/B performance within ±0.5%); promote and rollback exercised end to end in a disposable clone (production pin unchanged: no newer upstream release exists)."
  - id: R-NI-3
    section: "Assignment §4; design §6.1 (compat)"
    requirement: Unqualified MJBatch/MuJoCo pairs fail with an actionable error; candidate mode requires every behaviour probe and is refused in production.
    implementation: [src/raysimbatch/compat/mjbatch_adapter.py, src/raysimbatch/config/system.py]
    config: []
    tests: [tests/config/test_config.py, tests/upstream/test_mjbatch_contract.py]
    evidence: []
    status: VERIFIED
  - id: R-DOC-1
    section: "Assignment §9"
    requirement: English documentation for installation, configuration, Modes A/B/C, integration, troubleshooting, operations, MJBatch boundaries, upgrade/rollback, qualification results.
    implementation: [docs/architecture.md, docs/installation.md, docs/reference/configuration.md, docs/usage/mode-a-rollout.md, docs/usage/mode-b-evaluation.md, docs/usage/mode-c-sim2sim.md, docs/usage/routing.md, docs/deployment/kuberay.md, docs/operations/observability.md, docs/operations/runbooks.md, docs/operations/mjbatch-upgrade.md, docs/troubleshooting.md, docs/extending.md, docs/mjbatch-integration.md, docs/design-amendments.md, docs/qualification/report.md, docs/qualification/verify-gates.md]
    config: []
    tests: [tests/examples/test_examples.py, tests/telemetry/test_alerts.py]
    evidence: []
    status: VERIFIED
    notes: "Examples and runbook anchors are executed/checked by tests; the configuration reference is generated (tools/gen_config_reference.py --check)."

