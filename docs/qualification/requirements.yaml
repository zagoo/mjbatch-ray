  - id: R-3.3.6
    section: "§4 3.3.6, §9.1-9.3, §13.1-13.3"
    requirement: Throughput/latency SLOs (wrapper >=90% of equal-thread upstream; p99 slice <=20 ms; round trip <=50 ms).
    implementation: [qualification/bench_throughput.py, qualification/bench_overhead.py, qualification/bench_inference.py, src/raysimbatch/worker/core.py, native/src/kernels.h]
    config: [worker.fuse_substeps, models.health.check_each_substep]
    tests: [tests/core/test_fused.py, tests/core/test_book.py, tests/core/test_substep_settle.py]
    evidence: [evidence/perf/mjbatch-0.1.4/throughput-overhead-64.json, evidence/perf/mjbatch-0.1.4/throughput-overhead-256.json, evidence/perf/throughput-overhead-64.json, evidence/perf/throughput-overhead-256.json, evidence/perf/overhead-after.json, evidence/perf/overhead-before.json, evidence/perf/throughput-fused-64.json, evidence/perf/throughput-fused-256.json, evidence/perf/throughput-macos-arm64.json, evidence/perf/inference-curves.json]
    status: IMPLEMENTED
    notes: "Measured on Apple arm64 (interleaved): met for the contact model (quadruped 0.97-1.20x); for the lightest models fused stepping with native bookkeeping (AM-2, identical results) gives 0.75-0.93x vs 0.44-0.78x per-substep - the target is met for cartpole at 64 slots/1 thread and 256 slots/1-2 threads only. The owner accepted these figures on 2026-09-29 and closed AM-2 optimization. Re-measured on MJBatch 0.1.4 (2026-10-09, evidence/perf/mjbatch-0.1.4/): per-substep 0.60-0.86x (up 0.04-0.16), fused 0.77-0.93x (within the spread; cartpole 0.01-0.02 lower), quadruped 1.10-1.24x; met for cartpole fused at 256 slots/1-2 threads, 0.899 at 64 slots/1 thread. The owner accepted the 0.1.4 figures as the AM-2 baseline on 2026-10-09. The status stays IMPLEMENTED because the target is not met, and it is unmeasured on the reference x86-64 nodes (R-X86). In-process policy inference p99 is below 0.4 ms at batch 1024 (CPU, MPS); the p99 slice and round-trip SLOs on target hardware and the CUDA service are BLOCKED."
